[server]

rpc_port = 8545

[backend]
response_timeout_seconds = 1

[backends]
[backends.good]
rpc_url = "$GOOD_BACKEND_RPC_URL"
ws_url = "$GOOD_BACKEND_RPC_URL"

[backend_groups]
[backend_groups.main]
backends = ["good"]
routing_strategy = "consensus_aware"
consensus_handler = "noop" # driven manually in the test for determinism

[rpc_method_mappings]
eth_chainId = "main"
