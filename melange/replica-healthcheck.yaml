package:
  name: replica-healthcheck
  version: "0.0.0"
  epoch: 0
  description: replica-healthcheck — OP Stack replica health checker
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - nodejs-22
      - yarn
      - build-base

pipeline:
  - runs: |
      set -euo pipefail
      cd replica-healthcheck
      yarn install --frozen-lockfile --ignore-scripts
      yarn build
      mkdir -p ${{targets.contextdir}}/usr/share/replica-healthcheck
      cp -r dist ${{targets.contextdir}}/usr/share/replica-healthcheck/
      cp -r node_modules ${{targets.contextdir}}/usr/share/replica-healthcheck/
      cp package.json ${{targets.contextdir}}/usr/share/replica-healthcheck/
      find ${{targets.contextdir}}/usr/share/replica-healthcheck/node_modules -type d -name '*musl*' -exec rm -rf {} + 2>/dev/null || true
      find ${{targets.contextdir}}/usr/share/replica-healthcheck/node_modules -type f -name '*musl*.node' -delete 2>/dev/null || true
