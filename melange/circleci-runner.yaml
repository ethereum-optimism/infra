package:
  name: circleci-runner
  version: "2026.2.2"
  epoch: 1
  description: CircleCI runner tooling for Optimism CI jobs
  copyright:
    - license: MIT

environment:
  contents:
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    repositories:
      - https://packages.wolfi.dev/os
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - runs: |
      set -euo pipefail

      mise_version=2026.2.2
      case "${{build.arch}}" in
        x86_64)
          platform=linux-x64
          checksum=7d1ffcceb32f861d9d0e00b7ccabe9ee962d6ca51daa7f66715c46b9856169d8
          ;;
        aarch64)
          platform=linux-arm64
          checksum=86576902e7cb0fe860d192961c6fecc756e585c16420b0c00c9485bc64f8f86d
          ;;
        *)
          echo "unsupported melange arch for mise: ${{build.arch}}" >&2
          exit 1
          ;;
      esac

      archive="mise-v${mise_version}-${platform}.tar.gz"
      url="https://github.com/jdx/mise/releases/download/v${mise_version}/${archive}"
      work="$(mktemp -d)"
      trap 'rm -rf "$work"' EXIT

      curl -fsSL --retry 3 -o "$work/$archive" "$url"
      printf '%s  %s\n' "$checksum" "$work/$archive" | sha256sum -c -
      tar -xzf "$work/$archive" -C "$work"

      install -Dm755 \
        "$work/mise/bin/mise" \
        "${{targets.contextdir}}/home/circleci/.local/bin/mise"

      mkdir -p "${{targets.contextdir}}/usr/local/bin"
      ln -sf /home/circleci/.local/bin/mise "${{targets.contextdir}}/usr/local/bin/mise"

      chown -R 1001:1001 "${{targets.contextdir}}/home/circleci"

  # cimg/base grants the circleci user passwordless sudo; the checkout-with-mise
  # orb relies on it (sudo rm/mkdir/chown for /data/mise-data). Reproduce that.
  - runs: |
      set -euo pipefail
      install -d -m 0755 "${{targets.contextdir}}/etc/sudoers.d"
      printf 'circleci ALL=(ALL) NOPASSWD:ALL\n' \
        > "${{targets.contextdir}}/etc/sudoers.d/circleci"
      chmod 0440 "${{targets.contextdir}}/etc/sudoers.d/circleci"

  - uses: strip
